# Recurring fixtures worth watching for a programme announcement.
# Copy to annual-anchors.yaml and edit. Hand-maintained, no fetcher.
#
# Two shapes: typical_month/programme_announced for a fixture whose date
# floats and whose programme is announced ahead of time (most entries
# below); fixed_date ("MM-DD") + remind_days_before for one with a genuine
# fixed recurring date and no announcement to watch for (the fire/Viking
# festivals at the bottom).
- name: Celtic Connections
  typical_month: january
  programme_announced: october
  watch_url: ""

- name: Glasgow Film Festival
  typical_month: february
  programme_announced: january
  watch_url: ""

- name: Edinburgh Festival Fringe
