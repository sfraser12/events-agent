# Copy to config.yaml and fill in real values. config.yaml is gitignored.
home:
  latitude: 0.0
  longitude: 0.0
  label: ""

search:
  radius_miles: 25
  # Optional "worth a special trip" tier -- leave both commented out to keep
  # it off. When set, an event beyond radius_miles but within
  # far_radius_miles isn't rejected outright; it only surfaces if its score
  # also clears scoring.far_threshold below. See CLAUDE.md.
  # far_radius_miles: 200
  # far_min_latitude: 55.0
  horizons:
    near_days: 7
    month_days: 31
    long_days: 270

constraints:
  max_drive_minutes: 60
  price_ceiling: 0
  # List of date ranges, e.g.:
  #   - start: "2026-10-12"
  #     end: "2026-10-26"
  blackout_dates: []

scoring:
  digest_threshold: 60
  alert_threshold: 45
  # far_threshold: 85

delivery:
  email_to: ""

# Optional: Google Alerts RSS feeds for content that doesn't fit a ticketed-
# event API (e.g. spa/wellness deals). No public API creates an alert for
# you -- go to google.com/alerts, create one, choose "RSS feed" under
# "Deliver to", and paste the resulting feed URL below. Leave feed_url blank
# (or omit the entry) until then -- harvest skips it with a note rather than
# failing. latitude/longitude matter: see sources/google_alerts.py for why.
# google_alerts:
#   - venue_name: "Portavadie"
#     feed_url: ""
#     latitude: 0.0
#     longitude: 0.0
