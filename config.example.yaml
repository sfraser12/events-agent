# Copy to config.yaml and fill in real values. config.yaml is gitignored.
home:
  latitude: 0.0
  longitude: 0.0
  label: ""

search:
  radius_miles: 25
  # Optional "worth a special trip" tier -- leave both commented out to keep
  # it off. When set, an event beyond radius_miles but within
  # far_radius_miles isn't rejected outright; it only surfaces if its score
  # also clears scoring.far_threshold below. See CLAUDE.md.
  # far_radius_miles: 200
  # far_min_latitude: 55.0
  horizons:
    near_days: 7
    month_days: 31
    long_days: 270

constraints:
  max_drive_minutes: 60
  price_ceiling: 0
  # List of date ranges, e.g.:
  #   - start: "2026-10-12"
  #     end: "2026-10-26"
  blackout_dates: []

scoring:
  digest_threshold: 60
  alert_threshold: 45
  # far_threshold: 85

delivery:
  email_to: ""
